<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通道转兵红色资源库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            
            /* ========================================== */
            /* ★ 背景图 - 湖南省地图 */
            /* ========================================== */
            background-image: url('湖南省地图.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            overflow-y: auto;
        }

        /* ===== 顶部导航栏 ===== */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 30px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid rgba(204, 0, 0, 0.3);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .back-btn {
            color: #fff;
            font-size: 1.6rem;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover {
            color: #ff6b6b;
            transform: scale(1.05);
        }

        /* ★ 标题全部改为红色 */
        .nav-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #cc0000;
            letter-spacing: 2px;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 4px 4px 4px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .search-wrapper input {
            background: transparent;
            border: none;
            padding: 8px 10px;
            font-size: 0.9rem;
            color: #fff;
            outline: none;
            width: 160px;
        }
        .search-wrapper input::placeholder {
            color: #aaa;
            font-size: 0.85rem;
        }
        .search-btn {
            background: #cc0000;
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .search-btn:hover {
            background: #b30000;
            transform: scale(0.97);
        }

        /* ===== 主内容区域 ===== */
        .main-container {
            padding-top: 80px;
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ============================================ */
        /* ★ 滑动选择器 - 完美居中 + 无透明墙 */
        /* ============================================ */
        .slider-wrapper {
            width: 100%;
            max-width: 1100px;
            padding: 40px 0;  /* 左右padding设为0，去除透明墙 */
            position: relative;
            margin: 0 auto;
            overflow: visible;  /* 改为visible，让卡片完全可见 */
        }

        .slider-track {
            display: flex;
            align-items: center;
            justify-content: center;  /* ★ 关键：让卡片整体居中 */
            gap: 24px;
            padding: 20px 0;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            will-change: transform;
        }

        .slider-track.dragging {
            cursor: grabbing;
            transition: none !important;
        }

        .phase-slide-item {
            flex: 0 0 280px;
            min-height: 280px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 35px 24px 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transform: scale(0.85);
            opacity: 0.5;
        }

        .phase-slide-item.active {
            transform: scale(1.08);
            opacity: 1;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(204, 0, 0, 0.5);
            box-shadow: 0 8px 40px rgba(204, 0, 0, 0.25);
        }

        .phase-slide-item.side {
            transform: scale(0.90);
            opacity: 0.6;
        }

        .phase-slide-item.far {
            transform: scale(0.78);
            opacity: 0.35;
        }

        .phase-slide-item:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .phase-slide-item .phase-number {
            font-size: 0.8rem;
            color: #f7d98c;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .phase-slide-item .phase-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .phase-slide-item .phase-sub {
            font-size: 0.85rem;
            color: #c0c8d8;
            line-height: 1.5;
            opacity: 0.8;
        }

        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 24px;
        }

        .slider-dots .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: 0.3s;
        }

        .slider-dots .dot.active {
            background: #cc0000;
            border-color: #cc0000;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.4);
            transform: scale(1.2);
        }

        .slider-hint {
            text-align: center;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-top: 14px;
        }

        /* ===== 阶段详情页 ===== */
        .phase-detail {
            display: none;
            padding: 100px 40px 60px;
            max-width: 1000px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .phase-detail.active {
            display: block;
        }

        .phase-detail h2 {
            font-size: 2.8rem;
            color: #f7d98c;
            margin-bottom: 40px;
            text-align: center;
            border-bottom: 2px solid rgba(204, 0, 0, 0.3);
            padding-bottom: 20px;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
        }

        .sub-title {
            background: rgba(255, 255, 255, 0.06);
            border-left: 4px solid #cc0000;
            padding: 18px 24px;
            margin-bottom: 16px;
            border-radius: 0 12px 12px 0;
            transition: 0.2s;
            cursor: pointer;
            color: #e8e8f0;
            font-size: 1.1rem;
            backdrop-filter: blur(4px);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
        }
        .sub-title:hover {
            background: rgba(204, 0, 0, 0.15);
            transform: translateX(6px);
        }
        .sub-title::before {
            content: "▶ ";
            color: #cc0000;
            font-size: 0.8rem;
        }

        .phase-detail .empty-content {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            padding: 60px 0;
            letter-spacing: 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .phase-slide-item {
                flex: 0 0 220px;
                min-height: 220px;
                padding: 24px 18px;
            }
            .phase-slide-item .phase-title {
                font-size: 1.2rem;
            }
            .phase-slide-item .phase-sub {
                font-size: 0.75rem;
            }
            .nav-title {
                font-size: 1.1rem;
            }
            .search-wrapper input {
                width: 100px;
            }
            .slider-wrapper {
                padding: 40px 10px;
            }
        }

        @media (max-width: 600px) {
            .top-nav {
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 10px;
            }
            .nav-left {
                gap: 10px;
            }
            .nav-title {
                font-size: 0.95rem;
            }
            .back-btn {
                font-size: 1.2rem;
            }
            .search-wrapper input {
                width: 80px;
                font-size: 0.8rem;
            }
            .search-btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            .phase-slide-item {
                flex: 0 0 180px;
                min-height: 180px;
                padding: 18px 14px;
            }
            .phase-slide-item .phase-title {
                font-size: 1rem;
            }
            .phase-slide-item .phase-number {
                font-size: 0.6rem;
            }
            .phase-detail h2 {
                font-size: 2rem;
            }
            .main-container {
                padding-top: 70px;
            }
            .slider-hint {
                font-size: 0.65rem;
            }
            .slider-wrapper {
                padding: 40px 5px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部导航栏 ===== -->
    <nav class="top-nav">
        <div class="nav-left">
            <a href="#" class="back-btn" id="backBtn">
                <span>←</span>
            </a>
            <!-- ★ 标题全部改为红色 -->
            <span class="nav-title">通道转兵红色资源库</span>
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="搜索内容">
            <button class="search-btn" id="searchBtn">搜索</button>
        </div>
    </nav>

    <!-- ===== 主页面 ===== -->
    <div class="main-container" id="mainPage">

        <div class="slider-wrapper" id="sliderWrapper">
            <div class="slider-track" id="sliderTrack">

                <div class="phase-slide-item" data-phase="1">
                    <div class="phase-number">阶段 01</div>
                    <div class="phase-title">危机酝酿</div>
                    <div class="phase-sub">通道转兵的历史背景与危机</div>
                </div>

                <div class="phase-slide-item" data-phase="2">
                    <div class="phase-number">阶段 02</div>
                    <div class="phase-title">会议决策</div>
                    <div class="phase-sub">关键会议与决策过程</div>
                </div>

                <div class="phase-slide-item" data-phase="3">
                    <div class="phase-number">阶段 03</div>
                    <div class="phase-title">实施转兵</div>
                    <div class="phase-sub">转兵实施与历史影响</div>
                </div>

            </div>

            <div class="slider-dots" id="sliderDots">
                <span class="dot" data-index="0"></span>
                <span class="dot active" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>

            <div class="slider-hint">↔ 左右滑动查看三个阶段</div>
        </div>

    </div>

    <!-- ===== 阶段详情页 ===== -->
    <div class="phase-detail" id="phase1Detail">
        <h2>📖 危机酝酿</h2>
        <div class="empty-content">暂无更多内容</div>
    </div>

    <div class="phase-detail" id="phase2Detail">
        <h2>📖 会议决策</h2>
        <div class="sub-title">会议召开与争论</div>
        <div class="sub-title">关键人物的决策</div>
        <div class="sub-title">军事路线的转变</div>
        <div class="sub-title">历史档案与回忆</div>
    </div>

    <div class="phase-detail" id="phase3Detail">
        <h2>📖 实施转兵</h2>
        <div class="empty-content">暂无更多内容</div>
    </div>

    <script>
        (function() {
            // ===== DOM 引用 =====
            const mainPage = document.getElementById('mainPage');
            const phaseDetails = [
                document.getElementById('phase1Detail'),
                document.getElementById('phase2Detail'),
                document.getElementById('phase3Detail')
            ];
            const backBtn = document.getElementById('backBtn');
            const sliderTrack = document.getElementById('sliderTrack');
            const sliderWrapper = document.getElementById('sliderWrapper');
            const dots = document.querySelectorAll('.dot');
            const items = document.querySelectorAll('.phase-slide-item');

            const totalItems = items.length;
            let currentIndex = 1;
            let isDragging = false;
            let startX = 0;
            let currentTranslateX = 0;
            let prevTranslateX = 0;
            let isAnimating = false;

            // ===== 获取卡片宽度（含gap） =====
            function getCardWidth() {
                const rect = items[0].getBoundingClientRect();
                const gap = 24;
                return rect.width + gap;
            }

            // ===== 获取容器宽度 =====
            function getContainerWidth() {
                return sliderWrapper.getBoundingClientRect().width;
            }

            // ===== 计算居中偏移 =====
            function calculateTranslate(index) {
                const cardWidth = getCardWidth();
                const containerWidth = getContainerWidth();
                const totalWidth = totalItems * cardWidth;

                // 目标：让卡片居中
                const targetLeft = (containerWidth - cardWidth) / 2;
                let translateX = targetLeft - index * cardWidth;

                // 边界限制
                const maxTranslate = 0;
                const minTranslate = -(totalWidth - containerWidth);
                translateX = Math.max(minTranslate, Math.min(maxTranslate, translateX));

                return translateX;
            }

            // ===== 更新滑块 =====
            function updateSlider(index, animate = true) {
                if (isAnimating) return;
                if (index < 0) index = 0;
                if (index >= totalItems) index = totalItems - 1;
                currentIndex = index;

                const translateX = calculateTranslate(index);

                if (animate) {
                    isAnimating = true;
                    sliderTrack.style.transition = 'transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                } else {
                    sliderTrack.style.transition = 'none';
                }

                sliderTrack.style.transform = `translateX(${translateX}px)`;
                currentTranslateX = translateX;
                prevTranslateX = translateX;

                // 更新卡片样式
                items.forEach((item, i) => {
                    const offset = i - index;
                    item.classList.remove('active', 'side', 'far');
                    if (offset === 0) {
                        item.classList.add('active');
                    } else if (Math.abs(offset) === 1) {
                        item.classList.add('side');
                    } else {
                        item.classList.add('far');
                    }
                });

                // 更新小圆点
                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });

                if (animate) {
                    setTimeout(() => {
                        isAnimating = false;
                    }, 550);
                } else {
                    isAnimating = false;
                }
            }

            // ===== 拖拽逻辑 =====
            function dragStart(clientX) {
                if (isAnimating) return;
                isDragging = true;
                startX = clientX;
                prevTranslateX = currentTranslateX;
                sliderTrack.classList.add('dragging');
                sliderTrack.style.transition = 'none';
            }

            function dragMove(clientX) {
                if (!isDragging) return;
                const deltaX = clientX - startX;
                let newTranslate = prevTranslateX + deltaX;

                const cardWidth = getCardWidth();
                const containerWidth = getContainerWidth();
                const totalWidth = totalItems * cardWidth;
                const maxTranslate = 0;
                const minTranslate = -(totalWidth - containerWidth);

                if (newTranslate > maxTranslate) {
                    newTranslate = maxTranslate + (newTranslate - maxTranslate) * 0.3;
                } else if (newTranslate < minTranslate) {
                    newTranslate = minTranslate + (newTranslate - minTranslate) * 0.3;
                }

                sliderTrack.style.transform = `translateX(${newTranslate}px)`;
                currentTranslateX = newTranslate;
            }

            function dragEnd(clientX) {
                if (!isDragging) return;
                isDragging = false;
                sliderTrack.classList.remove('dragging');

                const deltaX = clientX - startX;

                if (Math.abs(deltaX) > 40) {
                    if (deltaX < 0 && currentIndex < totalItems - 1) {
                        updateSlider(currentIndex + 1);
                    } else if (deltaX > 0 && currentIndex > 0) {
                        updateSlider(currentIndex - 1);
                    } else {
                        updateSlider(currentIndex);
                    }
                } else {
                    // 检测点击卡片
                    const trackRect = sliderTrack.getBoundingClientRect();
                    const relX = clientX - trackRect.left;
                    const cardWidth = getCardWidth();
                    const clickedIndex = Math.round((relX - currentTranslateX) / cardWidth);
                    if (clickedIndex >= 0 && clickedIndex < totalItems) {
                        const phase = items[clickedIndex].dataset.phase;
                        if (phase && clickedIndex === currentIndex) {
                            showPhase(phase);
                            return;
                        }
                    }
                    updateSlider(currentIndex);
                }
            }

            // ===== 鼠标事件 =====
            sliderTrack.addEventListener('mousedown', (e) => {
                e.preventDefault();
                dragStart(e.clientX);
            });

            window.addEventListener('mousemove', (e) => {
                dragMove(e.clientX);
            });

            window.addEventListener('mouseup', (e) => {
                if (isDragging) {
                    dragEnd(e.clientX);
                }
            });

            // ===== 触摸事件 =====
            sliderTrack.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                dragStart(touch.clientX);
            }, { passive: true });

            sliderTrack.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                dragMove(touch.clientX);
            }, { passive: true });

            sliderTrack.addEventListener('touchend', (e) => {
                if (isDragging) {
                    const touch = e.changedTouches[0];
                    dragEnd(touch.clientX);
                }
            }, { passive: true });

            // ===== 小圆点点击 =====
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    if (!isAnimating) {
                        updateSlider(index);
                    }
                });
            });

            // ===== 键盘控制 =====
            document.addEventListener('keydown', (e) => {
                if (mainPage.style.display === 'none') return;
                if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    updateSlider(currentIndex - 1);
                } else if (e.key === 'ArrowRight' && currentIndex < totalItems - 1) {
                    updateSlider(currentIndex + 1);
                }
            });

            // ===== 阶段详情 =====
            function showPhase(phaseNumber) {
                mainPage.style.display = 'none';
                phaseDetails.forEach(p => p.classList.remove('active'));
                const target = document.getElementById('phase' + phaseNumber + 'Detail');
                if (target) {
                    target.classList.add('active');
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function goToMain() {
                mainPage.style.display = 'flex';
                phaseDetails.forEach(p => p.classList.remove('active'));
                window.scrollTo({ top: 0, behavior: 'smooth' });
                requestAnimationFrame(() => {
                    setTimeout(() => updateSlider(currentIndex, false), 50);
                });
            }

            backBtn.addEventListener('click', function(e) {
                e.preventDefault();
                goToMain();
            });

            // ===== 窗口变化 =====
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (mainPage.style.display !== 'none') {
                        updateSlider(currentIndex, false);
                    }
                }, 200);
            });

            // ===== 搜索 =====
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');

            function handleSearch() {
                const query = searchInput.value.trim();
                if (query === '') {
                    alert('请输入搜索内容');
                    return;
                }
                alert('🔍 您搜索了: "' + query + '"\n(搜索功能暂未实现)');
            }

            searchBtn.addEventListener('click', handleSearch);
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSearch();
                }
            });

            // ===== 小标题点击 =====
            document.querySelectorAll('#phase2Detail .sub-title').forEach(item => {
                item.addEventListener('click', function() {
                    alert('📌 您点击了: "' + this.textContent.trim() + '"');
                });
            });

            // ===== 初始化 =====
            window.addEventListener('load', () => {
                setTimeout(() => {
                    updateSlider(1, false);
                }, 100);
                setTimeout(() => {
                    updateSlider(1, false);
                }, 300);
            });

            console.log('✅ 通道转兵红色资源库 已加载');
            console.log('📌 标题全部红色 | 选项框居中 | 无透明墙');
        })();
    </script>

</body>
</html>
