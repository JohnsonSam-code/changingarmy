<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湘西通道转兵红色数字资源库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        /* ========== 壁纸背景 ========== */
        /* ★ 批注：此处为网站背景壁纸，请将 "your-wallpaper.jpg" 替换为您的图片文件名 */
        .wallpaper-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('your-wallpaper.jpg') center center / cover no-repeat;
            z-index: 0;
        }
        /* 壁纸遮罩层（使文字更清晰） */
        .wallpaper-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1;
        }

        /* ========== 主内容容器 ========== */
        .main-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ========== 标题 ========== */
        .site-title {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }
        .site-title .black {
            color: #1a1a1a;
        }
        .site-title .red {
            color: #cc0000;
        }

        /* ========== 搜索框 ========== */
        .search-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 560px;
            margin-bottom: 50px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 60px;
            padding: 4px 4px 4px 0;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .search-wrapper input {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 60px 0 0 60px;
            font-size: 1rem;
            outline: none;
            background: #ffffff;
            color: #333;
            min-width: 0;
        }
        .search-wrapper input::placeholder {
            color: #999;
            font-size: 0.95rem;
        }

        .search-btn {
            flex-shrink: 0;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: none;
            background: #cc0000;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 4px;
            box-shadow: 0 4px 14px rgba(204, 0, 0, 0.35);
        }
        .search-btn:hover {
            background: #b30000;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(204, 0, 0, 0.5);
        }
        .search-btn:active {
            transform: scale(0.95);
        }

        /* ========== 三张图片卡片 ========== */
        /* ★ 批注：图片行 — 三张图片并排展示，请将 image-1.jpg, image-2.jpg, image-3.jpg 替换为您的图片文件名 */
        .cards-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1000px;
            flex-wrap: wrap;
        }

        .card-item {
            flex: 1;
            min-width: 200px;
            max-width: 300px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease;
        }
        .card-item:hover {
            transform: translateY(-6px);
        }

        .card-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        /* ★ 批注：文字行 — 每张图片下方的说明文字 */
        .card-item .card-caption {
            padding: 16px 18px 20px;
            text-align: center;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 500;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .site-title {
                font-size: 2.2rem;
                letter-spacing: 2px;
            }
            .search-wrapper {
                max-width: 100%;
                padding: 3px 3px 3px 0;
            }
            .search-wrapper input {
                padding: 14px 18px;
                font-size: 0.95rem;
            }
            .search-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
            .cards-row {
                gap: 20px;
            }
            .card-item {
                min-width: 150px;
                max-width: 260px;
            }
            .card-item img {
                height: 160px;
            }
        }

        @media (max-width: 480px) {
            .site-title {
                font-size: 1.6rem;
            }
            .card-item {
                min-width: 130px;
                max-width: 100%;
                flex: 0 0 calc(50% - 12px);
            }
            .card-item img {
                height: 140px;
            }
            .card-item .card-caption {
                font-size: 0.9rem;
                padding: 12px 12px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 壁纸背景 ===== -->
    <!-- ★ 批注：壁纸行 — 请将 "your-wallpaper.jpg" 替换为您自己的壁纸文件名 -->
    <div class="wallpaper-container"></div>
    <div class="wallpaper-overlay"></div>

    <!-- ===== 主内容 ===== -->
    <div class="main-content">

        <!-- 标题 -->
        <h1 class="site-title">
            <span class="black">湘西通道转兵</span>
            <span class="red">红色数字资源库</span>
        </h1>

        <!-- 搜索框 -->
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="输入内容" aria-label="搜索框">
            <button class="search-btn" id="searchBtn" aria-label="搜索">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
            </button>
        </div>

        <!-- 三张图片卡片 -->
        <!-- ★ 批注：图片行 — 三张图片并排，请将 image-1.jpg, image-2.jpg, image-3.jpg 替换为您的图片 -->
        <!-- ★ 批注：文字行 — 每张图片下方的说明文字，请替换为对应的文字内容 -->
        <div class="cards-row">

            <div class="card-item">
                <img src="image-1.jpg" alt="图片1">
                <div class="card-caption">文字说明一</div>
            </div>

            <div class="card-item">
                <img src="image-2.jpg" alt="图片2">
                <div class="card-caption">文字说明二</div>
            </div>

            <div class="card-item">
                <img src="image-3.jpg" alt="图片3">
                <div class="card-caption">文字说明三</div>
            </div>

        </div>

    </div>

    <script>
        (function() {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');

            // 搜索功能（暂时只做交互提示）
            function handleSearch() {
                const query = searchInput.value.trim();
                if (query === '') {
                    alert('请输入搜索内容');
                    return;
                }
                alert('🔍 您搜索了: "' + query + '"\n(搜索功能暂未实现)');
                // 未来可在此处接入真实搜索逻辑
            }

            // 点击按钮搜索
            searchBtn.addEventListener('click', handleSearch);

            // 回车键搜索
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSearch();
                }
            });

            console.log('✅ 湘西通道转兵红色数字资源库 已加载');
        })();
    </script>

</body>
</html>
