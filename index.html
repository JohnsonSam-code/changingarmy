<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通道转兵红色资源库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background-image: url('湖南省地图.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            overflow-y: auto;
        }

        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 30px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid rgba(204, 0, 0, 0.3);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .back-btn {
            color: #fff;
            font-size: 1.6rem;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover {
            color: #ff6b6b;
            transform: scale(1.05);
        }

        .nav-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 4px 4px 4px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .search-wrapper input {
            background: transparent;
            border: none;
            padding: 8px 10px;
            font-size: 0.9rem;
            color: #fff;
            outline: none;
            width: 160px;
        }
        .search-wrapper input::placeholder {
            color: #aaa;
            font-size: 0.85rem;
        }
        .search-btn {
            background: #cc0000;
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .search-btn:hover {
            background: #b30000;
            transform: scale(0.97);
        }

        .main-container {
            padding-top: 80px;
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ===== 固定式三阶段选择器（带图片） ===== */
        .slider-wrapper {
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            margin: 0 auto;
        }

        .slider-track {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 30px;
            padding: 20px 0;
        }

        .phase-slide-item {
            flex: 0 0 280px;
            min-height: 320px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 20px 20px 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
            overflow: hidden;
        }

        .phase-slide-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-6px);
            border-color: rgba(204, 0, 0, 0.3);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        /* ★ 选项框图片 */
        .phase-slide-item .phase-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 14px;
            background: #2a2a4a;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .phase-slide-item .phase-number {
            font-size: 0.75rem;
            color: #f7d98c;
            letter-spacing: 2px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .phase-slide-item .phase-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .phase-slide-item .phase-sub {
            font-size: 0.8rem;
            color: #c0c8d8;
            line-height: 1.5;
            opacity: 0.8;
        }

        /* ===== 阶段详情页 ===== */
        .phase-detail {
            display: none;
            padding: 100px 40px 60px;
            max-width: 1000px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .phase-detail.active {
            display: block;
        }

        .phase-detail h2 {
            font-size: 2.8rem;
            color: #f7d98c;
            margin-bottom: 40px;
            text-align: center;
            border-bottom: 2px solid rgba(204, 0, 0, 0.3);
            padding-bottom: 20px;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
        }

        .sub-title {
            background: rgba(255, 255, 255, 0.06);
            border-left: 4px solid #cc0000;
            padding: 18px 24px;
            margin-bottom: 16px;
            border-radius: 0 12px 12px 0;
            transition: 0.2s;
            cursor: pointer;
            color: #e8e8f0;
            font-size: 1.1rem;
            backdrop-filter: blur(4px);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
        }
        .sub-title:hover {
            background: rgba(204, 0, 0, 0.15);
            transform: translateX(6px);
        }
        .sub-title::before {
            content: "▶ ";
            color: #cc0000;
            font-size: 0.8rem;
        }

        .phase-detail .empty-content {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            padding: 60px 0;
            letter-spacing: 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .slider-track {
                flex-wrap: wrap;
                gap: 20px;
            }
            .phase-slide-item {
                flex: 0 0 220px;
                min-height: 260px;
                padding: 16px 16px 20px;
            }
            .phase-slide-item .phase-image {
                height: 130px;
            }
            .phase-slide-item .phase-title {
                font-size: 1.1rem;
            }
            .phase-slide-item .phase-sub {
                font-size: 0.7rem;
            }
            .nav-title {
                font-size: 1.1rem;
            }
            .search-wrapper input {
                width: 100px;
            }
        }

        @media (max-width: 600px) {
            .top-nav {
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 10px;
            }
            .nav-left {
                gap: 10px;
            }
            .nav-title {
                font-size: 0.95rem;
            }
            .back-btn {
                font-size: 1.2rem;
            }
            .search-wrapper input {
                width: 80px;
                font-size: 0.8rem;
            }
            .search-btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            .slider-track {
                flex-direction: column;
                align-items: center;
                gap: 16px;
            }
            .phase-slide-item {
                flex: 0 0 auto;
                width: 100%;
                max-width: 300px;
                min-height: 200px;
                padding: 14px 14px 18px;
            }
            .phase-slide-item .phase-image {
                height: 120px;
            }
            .phase-slide-item .phase-title {
                font-size: 1rem;
            }
            .phase-slide-item .phase-number {
                font-size: 0.6rem;
            }
            .phase-detail h2 {
                font-size: 2rem;
            }
            .main-container {
                padding-top: 70px;
            }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-left">
            <a href="#" class="back-btn" id="backBtn">
                <span>←</span>
            </a>
            <span class="nav-title">通道转兵红色资源库</span>
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="搜索内容">
            <button class="search-btn" id="searchBtn">搜索</button>
        </div>
    </nav>

    <div class="main-container" id="mainPage">

        <div class="slider-wrapper">
            <div class="slider-track">

                <!-- ===== 选项框1：血战湘江 ===== -->
                <!-- ★ 批注：请将 "血战湘江.jpg" 替换为您的图片文件名 -->
                <div class="phase-slide-item" data-phase="1">
                    <img class="phase-image" src="血战湘江.jpg" alt="血战湘江">
                    <div class="phase-number">阶段 01</div>
                    <div class="phase-title">血战湘江</div>
                    <div class="phase-sub">湘江战役的历史背景与惨烈战斗</div>
                </div>

                <!-- ===== 选项框2：通道会议 ===== -->
                <!-- ★ 批注：请将 "通道会议.jpg" 替换为您的图片文件名 -->
                <div class="phase-slide-item" data-phase="2">
                    <img class="phase-image" src="通道会议.jpg" alt="通道会议">
                    <div class="phase-number">阶段 02</div>
                    <div class="phase-title">通道会议</div>
                    <div class="phase-sub">关键会议与转兵决策过程</div>
                </div>

                <!-- ===== 选项框3：通道转兵 ===== -->
                <!-- ★ 批注：请将 "通道转兵.jpg" 替换为您的图片文件名 -->
                <div class="phase-slide-item" data-phase="3">
                    <img class="phase-image" src="通道转兵.jpg" alt="通道转兵">
                    <div class="phase-number">阶段 03</div>
                    <div class="phase-title">通道转兵</div>
                    <div class="phase-sub">转兵实施与历史深远影响</div>
                </div>

            </div>
        </div>

    </div>

    <!-- ===== 阶段1详情页：血战湘江 ===== -->
    <div class="phase-detail" id="phase1Detail">
        <h2>📖 血战湘江</h2>
        <div class="empty-content">暂无更多内容</div>
    </div>

    <!-- ===== 阶段2详情页：通道会议 ===== -->
    <div class="phase-detail" id="phase2Detail">
        <h2>📖 通道会议</h2>
        <div class="sub-title">会议召开与争论</div>
        <div class="sub-title">关键人物的决策</div>
        <div class="sub-title">军事路线的转变</div>
        <div class="sub-title">历史档案与回忆</div>
    </div>

    <!-- ===== 阶段3详情页：通道转兵 ===== -->
    <div class="phase-detail" id="phase3Detail">
        <h2>📖 通道转兵</h2>
        <div class="empty-content">暂无更多内容</div>
    </div>

    <script>
        (function() {
            const mainPage = document.getElementById('mainPage');
            const phaseDetails = [
                document.getElementById('phase1Detail'),
                document.getElementById('phase2Detail'),
                document.getElementById('phase3Detail')
            ];
            const backBtn = document.getElementById('backBtn');
            const items = document.querySelectorAll('.phase-slide-item');

            // ===== 点击卡片跳转详情 =====
            items.forEach(card => {
                card.addEventListener('click', function() {
                    const phase = this.dataset.phase;
                    if (phase) {
                        mainPage.style.display = 'none';
                        phaseDetails.forEach(p => p.classList.remove('active'));
                        const target = document.getElementById('phase' + phase + 'Detail');
                        if (target) {
                            target.classList.add('active');
                        }
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            });

            // ===== 返回主页 =====
            function goToMain() {
                mainPage.style.display = 'flex';
                phaseDetails.forEach(p => p.classList.remove('active'));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            backBtn.addEventListener('click', function(e) {
                e.preventDefault();
                goToMain();
            });

            // ===== 搜索 =====
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');

            function handleSearch() {
                const query = searchInput.value.trim();
                if (query === '') {
                    alert('请输入搜索内容');
                    return;
                }
                alert('🔍 您搜索了: "' + query + '"\n(搜索功能暂未实现)');
            }

            searchBtn.addEventListener('click', handleSearch);
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSearch();
                }
            });

            // ===== 阶段2小标题点击 =====
            document.querySelectorAll('#phase2Detail .sub-title').forEach(item => {
                item.addEventListener('click', function() {
                    alert('📌 您点击了: "' + this.textContent.trim() + '"');
                });
            });

            console.log('✅ 通道转兵红色资源库 已加载');
            console.log('📌 三张图片：血战湘江 | 通道会议 | 通道转兵');
        })();
    </script>

</body>
</html>
