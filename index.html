<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通道转兵红色资源库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            
            /* ========================================== */
            /* ★ 背景图 - 湖南省地图 */
            /* ========================================== */
            background-image: url('湖南省地图.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            overflow-y: auto;
        }

        /* ===== 顶部导航栏 ===== */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 30px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid rgba(204, 0, 0, 0.3);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .back-btn {
            color: #fff;
            font-size: 1.6rem;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover {
            color: #ff6b6b;
            transform: scale(1.05);
        }

        .nav-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
        }
        .nav-title .red {
            color: #cc0000;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 4px 4px 4px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .search-wrapper input {
            background: transparent;
            border: none;
            padding: 8px 10px;
            font-size: 0.9rem;
            color: #fff;
            outline: none;
            width: 160px;
        }
        .search-wrapper input::placeholder {
            color: #aaa;
            font-size: 0.85rem;
        }
        .search-btn {
            background: #cc0000;
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .search-btn:hover {
            background: #b30000;
            transform: scale(0.97);
        }

        /* ===== 主内容区域 ===== */
        .main-container {
            padding-top: 80px;
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ============================================ */
        /* ★ 滑动式三阶段选择器 */
        /* ============================================ */
        .slider-wrapper {
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            overflow: hidden;
            position: relative;
            margin: 0 auto;
        }

        .slider-track {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            padding: 20px 0;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }

        .slider-track:active {
            cursor: grabbing;
        }

        /* ===== 阶段选项卡片 ===== */
        .phase-slide-item {
            flex: 0 0 240px;
            min-height: 260px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 30px 20px 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transform: scale(0.85);
            opacity: 0.5;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        /* ★ 中间的卡片放大 + 高亮 */
        .phase-slide-item.active {
            transform: scale(1.08);
            opacity: 1;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(204, 0, 0, 0.5);
            box-shadow: 0 8px 40px rgba(204, 0, 0, 0.25);
        }

        /* 旁边的卡片稍微缩小 */
        .phase-slide-item.side {
            transform: scale(0.90);
            opacity: 0.6;
        }

        /* 最旁边的卡片更小 */
        .phase-slide-item.far {
            transform: scale(0.78);
            opacity: 0.35;
        }

        .phase-slide-item:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .phase-slide-item .phase-number {
            font-size: 0.8rem;
            color: #f7d98c;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .phase-slide-item .phase-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .phase-slide-item .phase-sub {
            font-size: 0.85rem;
            color: #c0c8d8;
            line-height: 1.5;
            opacity: 0.8;
        }

        /* ===== 指示器（小圆点） ===== */
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 20px;
        }

        .slider-dots .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: 0.3s;
        }

        .slider-dots .dot.active {
            background: #cc0000;
            border-color: #cc0000;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.4);
            transform: scale(1.2);
        }

        .slider-dots .dot:hover {
            background: rgba(204, 0, 0, 0.5);
        }

        /* ===== 导航箭头 ===== */
        .slider-nav {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .slider-nav button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slider-nav button:hover {
            background: rgba(204, 0, 0, 0.3);
            border-color: #cc0000;
            transform: scale(1.05);
        }

        .slider-nav button:active {
            transform: scale(0.95);
        }

        /* ===== 阶段详情页 ===== */
        .phase-detail {
            display: none;
            padding: 100px 40px 60px;
            max-width: 1000px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .phase-detail.active {
            display: block;
        }

        .phase-detail h2 {
            font-size: 2.8rem;
            color: #f7d98c;
            margin-bottom: 40px;
            text-align: center;
            border-bottom: 2px solid rgba(204, 0, 0, 0.3);
            padding-bottom: 20px;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
        }

        /* ===== 阶段2小标题 ===== */
        .sub-title {
            background: rgba(255, 255, 255, 0.06);
            border-left: 4px solid #cc0000;
            padding: 18px 24px;
            margin-bottom: 16px;
            border-radius: 0 12px 12px 0;
            transition: 0.2s;
            cursor: pointer;
            color: #e8e8f0;
            font-size: 1.1rem;
            backdrop-filter: blur(4px);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
        }
        .sub-title:hover {
            background: rgba(204, 0, 0, 0.15);
            transform: translateX(6px);
        }
        .sub-title::before {
            content: "▶ ";
            color: #cc0000;
            font-size: 0.8rem;
        }

        .phase-detail .empty-content {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            padding: 60px 0;
            letter-spacing: 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .phase-slide-item {
                flex: 0 0 180px;
                min-height: 200px;
                padding: 20px 16px;
            }
            .phase-slide-item .phase-title {
                font-size: 1.2rem;
            }
            .phase-slide-item .phase-sub {
                font-size: 0.75rem;
            }
            .slider-nav button {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            .nav-title {
                font-size: 1.1rem;
            }
            .search-wrapper input {
                width: 100px;
            }
        }

        @media (max-width: 600px) {
            .top-nav {
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 10px;
            }
            .nav-left {
                gap: 10px;
            }
            .nav-title {
                font-size: 0.95rem;
            }
            .back-btn {
                font-size: 1.2rem;
            }
            .search-wrapper input {
                width: 80px;
                font-size: 0.8rem;
            }
            .search-btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            .phase-slide-item {
                flex: 0 0 150px;
                min-height: 160px;
                padding: 16px 12px;
            }
            .phase-slide-item .phase-title {
                font-size: 1rem;
            }
            .phase-slide-item .phase-number {
                font-size: 0.6rem;
            }
            .phase-detail h2 {
                font-size: 2rem;
            }
            .main-container {
                padding-top: 70px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部导航栏 ===== -->
    <nav class="top-nav">
        <div class="nav-left">
            <a href="#" class="back-btn" id="backBtn">
                <span>←</span>
            </a>
            <span class="nav-title">
                通道转兵<span class="red">红色资源库</span>
            </span>
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="搜索内容">
            <button class="search-btn" id="searchBtn">搜索</button>
        </div>
    </nav>

    <!-- ===== 主页面 ===== -->
    <div class="main-container" id="mainPage">

        <!-- ===== 滑动选择器 ===== -->
        <div class="slider-wrapper">
            <div class="slider-track" id="sliderTrack">

                <!-- 阶段1：危机酝酿 -->
                <div class="phase-slide-item" data-phase="1">
                    <div class="phase-number">阶段 01</div>
                    <div class="phase-title">危机酝酿</div>
                    <div class="phase-sub">通道转兵的历史背景与危机</div>
                </div>

                <!-- 阶段2：会议决策 -->
                <div class="phase-slide-item" data-phase="2">
                    <div class="phase-number">阶段 02</div>
                    <div class="phase-title">会议决策</div>
                    <div class="phase-sub">关键会议与决策过程</div>
                </div>

                <!-- 阶段3：实施转兵 -->
                <div class="phase-slide-item" data-phase="3">
                    <div class="phase-number">阶段 03</div>
                    <div class="phase-title">实施转兵</div>
                    <div class="phase-sub">转兵实施与历史影响</div>
                </div>

            </div>

            <!-- 小圆点指示器 -->
            <div class="slider-dots" id="sliderDots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>

            <!-- 导航箭头 -->
            <div class="slider-nav">
                <button id="prevBtn">‹</button>
                <button id="nextBtn">›</button>
            </div>
        </div>

    </div>

    <!-- ===== 阶段1详情页 ===== -->
    <div class="phase-detail" id="phase1Detail">
        <h2>📖 危机酝酿</h2>
        <div class="empty-content">暂无更多内容</div>
    </div>

    <!-- ===== 阶段2详情页 ===== -->
    <div class="phase-detail" id="phase2Detail">
        <h2>📖 会议决策</h2>
        <div class="sub-title">会议召开与争论</div>
        <div class="sub-title">关键人物的决策</div>
        <div class="sub-title">军事路线的转变</div>
        <div class="sub-title">历史档案与回忆</div>
    </div>

    <!-- ===== 阶段3详情页 ===== -->
    <div class="phase-detail" id="phase3Detail">
        <h2>📖 实施转兵</h2>
        <div class="empty-content">暂无更多内容</div>
    </div>

    <script>
        (function() {
            // ===== DOM 引用 =====
            const mainPage = document.getElementById('mainPage');
            const phase1Detail = document.getElementById('phase1Detail');
            const phase2Detail = document.getElementById('phase2Detail');
            const phase3Detail = document.getElementById('phase3Detail');
            const backBtn = document.getElementById('backBtn');
            const sliderTrack = document.getElementById('sliderTrack');
            const dots = document.querySelectorAll('.dot');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const items = document.querySelectorAll('.phase-slide-item');

            const phaseDetails = [phase1Detail, phase2Detail, phase3Detail];
            let currentIndex = 1; // 默认中间（索引1）
            let isDragging = false;
            let startX = 0;
            let currentTranslate = 0;
            let isAnimating = false;

            // ===== 更新滑块状态 =====
            function updateSlider(index, animate = true) {
                if (isAnimating) return;
                if (index < 0) index = 0;
                if (index > items.length - 1) index = items.length - 1;
                currentIndex = index;

                // 更新卡片样式
                items.forEach((item, i) => {
                    const offset = i - index;
                    item.classList.remove('active', 'side', 'far');
                    if (offset === 0) {
                        item.classList.add('active');
                    } else if (Math.abs(offset) === 1) {
                        item.classList.add('side');
                    } else {
                        item.classList.add('far');
                    }
                });

                // 更新小圆点
                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });

                // 滚动到对应位置（居中）
                if (animate) {
                    isAnimating = true;
                    sliderTrack.style.transition = 'all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                } else {
                    sliderTrack.style.transition = 'none';
                }

                // 计算偏移使选中项居中
                const containerWidth = sliderTrack.parentElement.offsetWidth;
                const itemWidth = items[0].offsetWidth + 20; // 宽度 + gap
                const totalWidth = items.length * itemWidth;
                const centerOffset = (containerWidth - itemWidth) / 2;
                const translateX = -(index * itemWidth) + centerOffset;

                // 限制边界
                const maxTranslate = 0;
                const minTranslate = -(totalWidth - containerWidth);
                const clamped = Math.max(minTranslate, Math.min(maxTranslate, translateX));

                sliderTrack.style.transform = `translateX(${clamped}px)`;

                setTimeout(() => {
                    isAnimating = false;
                }, 550);
            }

            // ===== 鼠标/触摸拖拽 =====
            sliderTrack.addEventListener('mousedown', (e) => {
                if (isAnimating) return;
                isDragging = true;
                startX = e.clientX;
                sliderTrack.style.cursor = 'grabbing';
                sliderTrack.style.transition = 'none';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const diff = startX - e.clientX;
                // 检测滑动方向，判断是否切换
            });

            window.addEventListener('mouseup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                sliderTrack.style.cursor = 'grab';
                // 根据滑动距离判断是否切换
                const diff = startX - e.clientX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0 && currentIndex < items.length - 1) {
                        updateSlider(currentIndex + 1);
                    } else if (diff < 0 && currentIndex > 0) {
                        updateSlider(currentIndex - 1);
                    } else {
                        updateSlider(currentIndex);
                    }
                } else {
                    updateSlider(currentIndex);
                }
            });

            // ===== 触摸事件 =====
            let touchStartX = 0;
            sliderTrack.addEventListener('touchstart', (e) => {
                if (isAnimating) return;
                touchStartX = e.touches[0].clientX;
                sliderTrack.style.transition = 'none';
            }, { passive: true });

            sliderTrack.addEventListener('touchend', (e) => {
                const diff = touchStartX - e.changedTouches[0].clientX;
                if (Math.abs(diff) > 40) {
                    if (diff > 0 && currentIndex < items.length - 1) {
                        updateSlider(currentIndex + 1);
                    } else if (diff < 0 && currentIndex > 0) {
                        updateSlider(currentIndex - 1);
                    } else {
                        updateSlider(currentIndex);
                    }
                } else {
                    // 点击卡片跳转详情
                    const target = document.elementFromPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                    const card = target.closest('.phase-slide-item');
                    if (card) {
                        const phase = card.dataset.phase;
                        if (phase) showPhase(phase);
                    }
                    updateSlider(currentIndex);
                }
            }, { passive: true });

            // ===== 点击卡片跳转详情 =====
            items.forEach(card => {
                card.addEventListener('click', function(e) {
                    const phase = this.dataset.phase;
                    if (phase) {
                        // 如果点击的是当前激活的卡片，跳转详情
                        if (this.classList.contains('active')) {
                            showPhase(phase);
                        } else {
                            // 否则切换到该卡片
                            const index = parseInt(this.dataset.phase) - 1;
                            updateSlider(index);
                        }
                    }
                });
            });

            // ===== 小圆点点击 =====
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    updateSlider(index);
                });
            });

            // ===== 导航箭头 =====
            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) updateSlider(currentIndex - 1);
            });

            nextBtn.addEventListener('click', () => {
                if (currentIndex < items.length - 1) updateSlider(currentIndex + 1);
            });

            // ===== 键盘控制 =====
            document.addEventListener('keydown', (e) => {
                if (mainPage.style.display === 'none') return;
                if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    updateSlider(currentIndex - 1);
                } else if (e.key === 'ArrowRight' && currentIndex < items.length - 1) {
                    updateSlider(currentIndex + 1);
                }
            });

            // ===== 显示阶段详情 =====
            function showPhase(phaseNumber) {
                mainPage.style.display = 'none';
                phaseDetails.forEach(p => p.classList.remove('active'));
                const target = document.getElementById('phase' + phaseNumber + 'Detail');
                if (target) {
                    target.classList.add('active');
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // ===== 返回主页 =====
            function goToMain() {
                mainPage.style.display = 'flex';
                phaseDetails.forEach(p => p.classList.remove('active'));
                window.scrollTo({ top: 0, behavior: 'smooth' });
                // 重新计算滑块位置
                setTimeout(() => updateSlider(currentIndex, false), 100);
            }

            backBtn.addEventListener('click', function(e) {
                e.preventDefault();
                goToMain();
            });

            // ===== 搜索功能 =====
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');

            function handleSearch() {
                const query = searchInput.value.trim();
                if (query === '') {
                    alert('请输入搜索内容');
                    return;
                }
                alert('🔍 您搜索了: "' + query + '"\n(搜索功能暂未实现)');
            }

            searchBtn.addEventListener('click', handleSearch);
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSearch();
                }
            });

            // ===== 阶段2小标题点击 =====
            document.querySelectorAll('#phase2Detail .sub-title').forEach(item => {
                item.addEventListener('click', function() {
                    alert('📌 您点击了: "' + this.textContent.trim() + '"\n(可在此处添加跳转或展开逻辑)');
                });
            });

            // ===== 窗口大小变化时重新计算 =====
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (mainPage.style.display !== 'none') {
                        updateSlider(currentIndex, false);
                    }
                }, 200);
            });

            // ===== 初始化 =====
            window.addEventListener('load', () => {
                setTimeout(() => updateSlider(1, false), 100);
            });

            console.log('✅ 通道转兵红色资源库 已加载');
            console.log('📌 三个阶段：危机酝酿 | 会议决策 | 实施转兵');
            console.log('📌 滑动选择器已启用，支持拖拽、点击、键盘控制');
        })();
    </script>

</body>
</html>
